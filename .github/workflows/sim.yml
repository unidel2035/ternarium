name: Verilog Simulation

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  iverilog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install iverilog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog

      - name: Run testbenches
        working-directory: tang-mega-138k-pro/tests
        run: |
          set -e
          make all 2>&1 | tee out.log
          # Падаем если хотя бы один тест не выдал "ALL TESTS PASSED" или fail counter > 0
          if grep -E "FAIL|SOME TESTS FAILED" out.log; then
            echo "::error::Testbench reported failures"
            exit 1
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testbench-logs
          path: tang-mega-138k-pro/tests/out.log
