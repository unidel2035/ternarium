name: Verilog Lint

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  yosys-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yosys
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y yosys

      - name: Parse all top modules
        run: |
          set -e
          cd tang-mega-138k-pro
          # Просто парсим — не синтезируем (это слишком долго для CI)
          for dir in tritgift stormbird tritscope tritrng sbus_expander \
                     sonar_hub imu_ahrs i2c_master sd_writer mavlink_lite \
                     crsf_decode dual_fc_failover gps_nmea oled_ssd1306; do
            if [ -d "$dir" ] && ls "$dir"/*.v >/dev/null 2>&1; then
              echo "::group::$dir"
              yosys -q -p "read_verilog $dir/*.v; hierarchy -check" || \
                echo "::warning::$dir has parse warnings"
              echo "::endgroup::"
            fi
          done
